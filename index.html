<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบการลา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f5f6fa; --card:#fff; --text:#1f2430; --muted:#667085; --ok:#12805c; --okbg:#e7f6ee; --warn:#93370d; --warnbg:#fef0c7; --bad:#b42318; --badbg:#fee4e2; --accent:#06c755; --line:#e4e7ec; --field:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121417; --card:#1c1f24; --text:#e8eaed; --muted:#9aa1ad; --ok:#4cc38a; --okbg:#173326; --warn:#fdb022; --warnbg:#3a2a0c; --bad:#f97066; --badbg:#3d1714; --line:#2c3038; --field:#14171b; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Sarabun',system-ui,sans-serif; font-size:17px; line-height:1.55; }
  main { max-width:520px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:22px; margin:0 0 2px; }
  h2 { font-size:19px; margin:0 0 10px; }
  .sub { color:var(--muted); margin:0 0 18px; font-size:15px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  label { display:block; font-weight:600; margin:14px 0 6px; }
  .hint { color:var(--muted); font-size:14px; margin:4px 0 0; }
  input, select { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--field); color:var(--text); font:inherit; }
  input.code { font-size:28px; letter-spacing:10px; text-align:center; }
  .row3 { display:grid; grid-template-columns: 1fr 1.6fr 1.2fr; gap:8px; }
  button { width:100%; padding:14px; border:0; border-radius:12px; background:var(--accent); color:#fff; font:inherit; font-weight:600; margin-top:16px; }
  button.secondary { background:transparent; color:var(--text); border:1px solid var(--line); }
  button:disabled { opacity:.5; }
  .msg { border-radius:10px; padding:10px 12px; margin-top:12px; font-size:15px; }
  .msg.bad { background:var(--badbg); color:var(--bad); }
  .msg.ok { background:var(--okbg); color:var(--ok); }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:14px; font-weight:600; }
  .badge.warn { background:var(--warnbg); color:var(--warn); }
  .badge.ok { background:var(--okbg); color:var(--ok); }
  .who { font-size:20px; font-weight:600; }
  .check { display:flex; gap:10px; align-items:flex-start; margin-top:14px; font-weight:400; }
  .check input { width:auto; margin-top:5px; }
  .menu button { text-align:left; }
  .center { text-align:center; color:var(--muted); padding:40px 0; }
  [hidden] { display:none !important; }
</style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
</head>
<body>
<main>
  <h1>ระบบการลา</h1>
  <p class="sub" id="org"></p>

  <section id="v-loading" class="center">กำลังโหลด…</section>

  <section id="v-error" hidden>
    <div class="card"><div class="msg bad" id="errorText"></div><p class="hint" id="errorContact"></p></div>
  </section>

  <!-- 1. กรอกรหัส -->
  <section id="v-code" hidden>
    <div class="card">
      <h2>ผูกบัญชี LINE กับทะเบียนบุคลากร</h2>
      <p class="hint">กรอกรหัส 6 หลักที่ได้รับจากงานบุคคล ทำครั้งเดียว ครั้งต่อไปเข้าระบบได้ทันที</p>
      <label for="code">รหัสผูกบัญชี</label>
      <input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
      <div id="codeMsg" class="msg bad" hidden></div>
      <button id="btnCheck">ตรวจรหัส</button>
    </div>
  </section>

  <!-- 2. ยืนยันตัวตน และกรอกข้อมูลตั้งต้น -->
  <section id="v-confirm" hidden>
    <div class="card">
      <h2>นี่คือคุณใช่ไหม</h2>
      <div class="who" id="cName"></div>
      <div class="hint" id="cPos"></div>
      <button class="secondary" id="btnNotMe">ไม่ใช่ฉัน</button>
    </div>
    <div class="card">
      <h2>ข้อมูลตั้งต้นสำหรับคำนวณสิทธิ์การลา</h2>
      <label id="appointLabel">วันบรรจุเข้ารับราชการครั้งแรก</label>
      <div class="row3" id="appoint"></div>
      <p class="hint" id="appointHint"></p>

      <div id="contBox" hidden>
        <label class="check"><input type="checkbox" id="rejoined"> เคยออกจากราชการแล้วกลับเข้ามาใหม่</label>
        <div id="contFields" hidden>
          <label>รับราชการต่อเนื่องมาตั้งแต่วันที่</label>
          <div class="row3" id="cont"></div>
          <p class="hint">ใช้หาเพดานวันลาพักผ่อนสะสม (ครบ 10 ปีสะสมได้ 30 วัน)</p>
        </div>
      </div>

      <div id="genderBox" hidden>
        <label for="gender">เพศ</label>
        <select id="gender"><option value="">เลือก</option><option>ชาย</option><option>หญิง</option></select>
      </div>

      <label class="check"><input type="checkbox" id="consent">
        <span>รับทราบว่าระบบเก็บบัญชี LINE วันบรรจุ และข้อมูลการลาของฉัน เพื่อใช้ยื่นลา อนุมัติ และสรุปวันลาตามระเบียบเท่านั้น งานบุคคลจะตรวจวันบรรจุกับทะเบียนประวัติ</span>
      </label>
      <div id="confirmMsg" class="msg bad" hidden></div>
      <button id="btnConfirm">ยืนยันและผูกบัญชี</button>
    </div>
  </section>

  <!-- 3. หน้าหลักหลังผูกบัญชี -->
  <section id="v-home" hidden>
    <div class="card">
      <div class="who" id="hName"></div>
      <div class="hint" id="hPos"></div>
      <p style="margin:10px 0 0"><span class="badge" id="hStatus"></span></p>
      <p class="hint" id="hStatusText"></p>
    </div>
    <div class="card menu">
      <button disabled>📝 ยื่นลา (กำลังพัฒนา)</button>
      <button disabled class="secondary">📅 วันลาของฉัน (กำลังพัฒนา)</button>
    </div>
  </section>
</main>
<script>
(function () {
  var cfg = window.LEAVE_CONFIG;
  var MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  var $ = function (id) { return document.getElementById(id); };
  var idToken = null, preview = null, hrContact = '';
  $('org').textContent = cfg.orgName;

  function show(view) {
    ['loading','error','code','confirm','home'].forEach(function (v) { $('v-' + v).hidden = v !== view; });
    window.scrollTo(0, 0);
  }
  function fail(text) {
    $('errorText').textContent = text;
    $('errorContact').textContent = hrContact ? 'ติดต่องานบุคคล ' + hrContact : 'ปิดหน้านี้แล้วเปิดใหม่ หรือติดต่องานบุคคล';
    show('error');
  }
  function note(el, text) { el.textContent = text; el.hidden = !text; }

  function api(action, extra) {
    var body = Object.assign({ action: action, idToken: idToken }, extra || {});
    return fetch(cfg.apiUrl, { method: 'POST', body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (res) { if (!res.ok) throw new Error(res.error); return res; });
  }

  // ---------- ช่องวันที่แบบ วัน / เดือน / ปี พ.ศ. ----------
  function datePicker(container) {
    var d = document.createElement('select'), m = document.createElement('select'), y = document.createElement('select');
    d.innerHTML = '<option value="">วัน</option>';
    for (var i = 1; i <= 31; i++) d.innerHTML += '<option value="' + i + '">' + i + '</option>';
    m.innerHTML = '<option value="">เดือน</option>' + MONTHS.map(function (n, i) { return '<option value="' + (i + 1) + '">' + n + '</option>'; }).join('');
    var thisYear = new Date().getFullYear() + 543;
    y.innerHTML = '<option value="">ปี พ.ศ.</option>';
    for (var yr = thisYear; yr >= 2503; yr--) y.innerHTML += '<option value="' + yr + '">' + yr + '</option>';
    container.innerHTML = '';
    [d, m, y].forEach(function (s) { container.appendChild(s); });
    return {
      set: function (iso) {
        if (!iso) return;
        var p = iso.split('-');
        y.value = String(+p[0] + 543); m.value = String(+p[1]); d.value = String(+p[2]);
      },
      get: function () {
        if (!d.value || !m.value || !y.value) return '';
        var ce = +y.value - 543, mm = ('0' + m.value).slice(-2), dd = ('0' + d.value).slice(-2);
        var test = new Date(Date.UTC(ce, +m.value - 1, +d.value));
        if (test.getUTCDate() !== +d.value) return 'invalid';
        return ce + '-' + mm + '-' + dd;
      }
    };
  }
  var appoint = datePicker($('appoint')), cont = datePicker($('cont'));

  // ---------- หน้าหลัก ----------
  function home(me) {
    hrContact = me.hrContact || hrContact;
    if (!me.linked) { show('code'); $('code').focus(); return; }
    $('hName').textContent = me.person.name;
    $('hPos').textContent = me.person.position;
    var verified = me.person.profileStatus === 'ยืนยันแล้ว';
    $('hStatus').className = 'badge ' + (verified ? 'ok' : 'warn');
    $('hStatus').textContent = verified ? 'ผูกบัญชีแล้ว · ข้อมูลยืนยันแล้ว' : 'ผูกบัญชีแล้ว · รองานบุคคลตรวจข้อมูล';
    $('hStatusText').textContent = verified ? '' : 'ระหว่างนี้ยื่นลาได้ตามปกติ แต่ใบลาจะผ่านงานบุคคลตรวจก่อน';
    show('home');
  }

  // ---------- 1. ตรวจรหัส ----------
  $('code').addEventListener('input', function () { this.value = this.value.replace(/\D/g, '').slice(0, 6); });
  $('btnCheck').addEventListener('click', function () {
    var btn = this, code = $('code').value;
    note($('codeMsg'), '');
    if (code.length !== 6) { note($('codeMsg'), 'กรอกรหัสให้ครบ 6 หลัก'); return; }
    btn.disabled = true; btn.textContent = 'กำลังตรวจ…';
    api('bindPreview', { code: code })
      .then(function (res) {
        preview = res.person;
        $('cName').textContent = preview.name;
        $('cPos').textContent = preview.position;
        $('appointLabel').textContent = preview.official ? 'วันบรรจุเข้ารับราชการครั้งแรก' : 'วันเริ่มจ้างครั้งแรก';
        $('appointHint').textContent = preview.appointDate
          ? 'งานบุคคลมีวันที่นี้อยู่แล้ว ถ้าถูกต้องไม่ต้องแก้'
          : (preview.official ? 'รับโอนมาจาก อปท. อื่น ให้กรอกวันบรรจุครั้งแรก ไม่ใช่วันรับโอน' : 'วันที่เริ่มสัญญาจ้างครั้งแรกกับหน่วยงานนี้');
        appoint.set(preview.appointDate);
        $('contBox').hidden = !preview.official;
        $('rejoined').checked = !!(preview.continuousServiceDate && preview.continuousServiceDate !== preview.appointDate);
        $('contFields').hidden = !$('rejoined').checked;
        cont.set(preview.continuousServiceDate);
        $('genderBox').hidden = !preview.needGender;
        show('confirm');
      })
      .catch(function (e) { note($('codeMsg'), e.message); })
      .then(function () { btn.disabled = false; btn.textContent = 'ตรวจรหัส'; });
  });

  // ---------- 2. ยืนยัน ----------
  $('btnNotMe').addEventListener('click', function () {
    $('code').value = '';
    note($('codeMsg'), 'ถ้าชื่อไม่ใช่คุณ แสดงว่ารหัสผิดคน ติดต่องานบุคคลเพื่อขอรหัสที่ถูกต้อง');
    show('code');
  });
  $('rejoined').addEventListener('change', function () { $('contFields').hidden = !this.checked; });

  $('btnConfirm').addEventListener('click', function () {
    var btn = this, msg = $('confirmMsg');
    note(msg, '');
    var a = appoint.get();
    if (!a) return note(msg, 'กรุณาเลือก' + $('appointLabel').textContent + 'ให้ครบ');
    if (a === 'invalid') return note(msg, 'วันที่ไม่ถูกต้อง');
    var c = '';
    if (preview.official && $('rejoined').checked) {
      c = cont.get();
      if (!c || c === 'invalid') return note(msg, 'กรุณาเลือกวันที่รับราชการต่อเนื่องให้ครบ');
    }
    if (preview.needGender && !$('gender').value) return note(msg, 'กรุณาเลือกเพศ');
    if (!$('consent').checked) return note(msg, 'กรุณาติ๊กรับทราบการใช้ข้อมูลก่อน');
    btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
    api('bindConfirm', { code: $('code').value, appointDate: a, continuousServiceDate: c, gender: $('gender').value })
      .then(home)
      .catch(function (e) { note(msg, e.message); })
      .then(function () { btn.disabled = false; btn.textContent = 'ยืนยันและผูกบัญชี'; });
  });

  // ---------- เริ่มต้น ----------
  liff.init({ liffId: cfg.liffId })
    .then(function () {
      if (!liff.isLoggedIn()) { liff.login(); return Promise.reject('redirect'); }
      idToken = liff.getIDToken();
      if (!idToken) throw new Error('เข้าสู่ระบบด้วย LINE ไม่สำเร็จ');
      return api('whoami');
    })
    .then(home)
    .catch(function (e) { if (e !== 'redirect') fail(e.message || String(e)); });
})();
</script>
</body>
</html>
